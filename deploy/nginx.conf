server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;

    location ~ ^/api/v1/media/uploads/[^/]+/content$ {
      proxy_pass http://backend:8080;
      client_max_body_size 1g;
      proxy_request_buffering off;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }
    location ~ ^/api/v1/resources/(items/[^/]+/download|packages/[^/]+/parts/[0-9]+)$ {
      proxy_pass http://backend:8080;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
    location = /api/v1/verification/capture {
      proxy_pass http://backend:8080;
      client_max_body_size 1m;
      proxy_read_timeout 75s;
    }
    location ~ ^/api/v1/storage/custody(/|$) {
      proxy_pass http://backend:8080;
      proxy_read_timeout 90s;
    }
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
