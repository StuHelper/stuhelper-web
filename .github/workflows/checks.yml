name: Web checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: StuHelper/stuhelper-tooling/.github/workflows/frontend-changes.yml@v0.1.13
  check:
    uses: StuHelper/stuhelper-tooling/.github/workflows/node-checks.yml@v0.1.13
    with:
      name: Web checks
  contribution-browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Contribution browser checks
    runs-on: ubuntu-26.04
    # The 16 locale/viewport projects run over 4,000 browser cases before the headed layout check.
    timeout-minutes: 60
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.13
      - uses: StuHelper/stuhelper-tooling/actions/frontend-cache@v0.1.13
      - name: Test transfer limits with an isolated Nginx proxy
        run: |
          sudo apt-get update -qq
          apt-get download nginx
          dpkg-deb -x nginx_*.deb "$RUNNER_TEMP/proxy-test"
          PATH="$RUNNER_TEMP/proxy-test/usr/sbin:$PATH" python3 tests/deploy/test_proxy.py
      - run: make setup
      - name: Record source combination
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          for record in contracts/*.source.json; do
            echo "#### $record" >> "$GITHUB_STEP_SUMMARY"
            cat "$record" >> "$GITHUB_STEP_SUMMARY"
          done
      - run: make build
      - uses: StuHelper/stuhelper-tooling/actions/chromium@v0.1.13
      - run: pnpm browser
      - name: Verification layout with classic scrollbars
        run: xvfb-run -a pnpm exec playwright test verification-ux --headed --project=desktop-zh-CN --project=desktop-ar-EG -g 'zero layout'
