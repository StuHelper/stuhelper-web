name: StuHelper Web release image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing annotated version tag on main
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  image:
    uses: StuHelper/stuhelper-tooling/.github/workflows/image.yml@v0.1.10
    with:
      application: web
      version: ${{ inputs.version || github.ref_name }}
