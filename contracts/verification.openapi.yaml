openapi: 3.0.3
info:
  title: StuHelper Verification
  version: 0.6.0
  description: Private verification API. Authentication supplies issuer and subject. All dates are RFC3339 UTC. Writes require an actor-scoped Idempotency-Key. School administration is authorized on every request.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/verification/me/school-data:
    get:
      operationId: getSchoolDataAuthorization
      responses:
        '200':
          description: Current authorization for the authenticated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolDataAuthorization' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: submitSchoolDataAuthorization
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolDataSubmission' }
      responses:
        '200':
          description: Current authorization for the authenticated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolDataAuthorization' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: revokeSchoolDataAuthorization
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Current authorization for the authenticated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolDataAuthorization' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/teacher-credentials:
    get:
      operationId: searchAdminTeacherCredentials
      description: School-scoped teacher credential search by school_id, teacher_id, owner, or state. Reads are audited.
      parameters:
        - name: school_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: teacher_id
          in: query
          schema: { type: string, maxLength: 128 }
        - name: owner
          in: query
          schema: { type: string, maxLength: 2740 }
        - name: state
          in: query
          schema: { type: string, enum: [active, revoked, expired] }
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching teacher qualifications in the authorized school.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeacherCredential' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/teacher-credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getTeacherCredential
      description: Read the current revision and status for school-scoped teacher administration. No raw evidence is returned.
      responses:
        '200':
          description: Current qualification and binding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherCredential' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/teacher-applications:
    post:
      operationId: createTeacherApplication
      description: Create an owner-bound manual teacher application. Reuse its capture and material endpoints; approval never grants student eligibility.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherCreateInput' }
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/teacher-form:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getOwnTeacherForm
      description: Read only the caller's teacher application form.
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherForm' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: submitTeacherForm
      description: Submit or supplement photographed teacher evidence with explicit field disclosure choices.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherForm' }
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/applications/{id}/teacher-form:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getTeacherForm
      description: Requires school-scoped teacher material permission; reads are audited.
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherForm' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/applications/{id}/teacher-review:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: reviewTeacherApplication
      description: Review independently from student applications. Approval validates canonical teacher IDs through catalog; if an active qualification already exists in the school for the applicant, approval merges bindings and refreshes expiry, disclosures and encrypted profile in place. Self-review is forbidden.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherReviewInput' }
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/teacher-credentials/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: requestTeacherRemoval
      description: Request revocation or physical deletion of the caller's teacher qualification. Eligibility is unchanged until approval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemovalInput' }
      responses:
        '200':
          description: Pending teacher removal request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovalRequest' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/schools/{id}/teacher-requests:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listTeacherRemovalQueue
      description: School-scoped pending teacher removal requests; requires teacher review permission.
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pending teacher removal requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemovalRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/teacher-requests/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: reviewTeacherRemoval
      description: Review a teacher removal request. Approved deletion clears encrypted teacher profile data, materials and active bindings while preserving student qualifications and independent identity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: Reviewed teacher removal request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovalRequest' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/schools/{id}/teacher-applications:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listTeacherReviewQueue
      description: Pending teacher applications in the authorized school, ordered by creation time ascending (FIFO).
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/teacher-credentials:
    get:
      operationId: listOwnTeacherCredentials
      description: The caller's teacher qualifications, including revoked and expired history, ordered by verification time descending.
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeacherCredential' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/teacher-credentials/{id}/disclosures:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      operationId: setTeacherDisclosures
      description: Change only the caller's public-field consent; revocation takes effect on subsequent fact reads.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherDisclosureInput' }
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherCredential' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/teacher-credentials/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: revokeTeacherCredential
      description: Revoke a teacher qualification and release its active bindings; retain audit and history. Approve must be true.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: Current result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherCredential' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/school-challenge:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: continueSchoolChallenge
      description: Poll the current bound school session, submit its SMS code once, or cancel it. Poll finalization is idempotent by application and never resends an SMS.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolChallengeInput' }
      responses:
        '200': { $ref: '#/components/responses/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/credentials/{id}/profile:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getOwnStudentProfile
      description: Read the caller's current school profile; sensitive reads are audited. Imported academic data is resolved through its source provider, never copied into credentials.
      responses:
        '200':
          description: Current data with its actual completeness and provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/credentials/{id}/profile:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getStudentProfile
      description: School-scoped profile access. Complete identity fields, document fields and raw business data each require their own authorization. Audit must commit before returning fields.
      parameters:
        - in: query
          name: full
          schema: { type: boolean, default: false }
        - in: query
          name: document
          schema: { type: boolean, default: false }
        - in: query
          name: raw
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Authorized current fields with provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/schools:
    get:
      operationId: listSchools
      description: Search enabled authentication schools using catalog school codes, names and registered aliases. Empty q lists enabled schools. Catalog failure returns unavailable, never an unfiltered list.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Trimmed literal school query. Numeric id/code matches exactly; five digits also match the suffix of a ten-digit id/code.
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Only currently usable methods are returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/School' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications:
    get:
      operationId: listApplications
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's applications, ordered by creation time descending.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createApplication
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApplication' }
      responses:
        '200': { $ref: '#/components/responses/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getApplication
      responses:
        '200': { $ref: '#/components/responses/Application' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: cancelApplication
      description: Cancel the caller's in_progress, pending_review, or supplement_required application and immediately clear its draft materials, capture tickets, email challenges, and encrypted form.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: verifyApplication
      description: Check campus roster identity or school account credentials. Admitted requests take at least the configured minimum (2.5 seconds by default), including success and credential rejection. Consecutive evidence failures are tracked per account and per school/student across methods. Cooldown, hourly quotas and concurrent admission can return 429 immediately without calling the school.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyInput' }
      responses:
        '200': { $ref: '#/components/responses/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/email:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getEmailChallenge
      responses:
        '200':
          description: Current challenge status and an active inbound destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChallenge' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEmailChallenge
      description: Check roster evidence before requesting school email proof. An outbound OTP starts with explicit acceptance of the effective email-transfer document. A resend for the same application may reuse a current, active receipt. The inbound challenge has no outbound transfer. Admitted requests take at least the configured minimum (2.5 seconds by default). Roster mismatches count toward the account and school/student cooldown. Issuing or resending a challenge does not reset that cooldown. Admission may return 429 immediately.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '200':
          description: Email challenge; outgoing delivery is queued durably.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChallenge' }
        '202': { $ref: '#/components/responses/Processing' }
        '403':
          description: Outbound transfer consent is required (email_transfer_consent_required), or access was denied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The effective transfer document changed (email_transfer_consent_changed), or the operation conflicts with current state. Fetch the current document and ask for a new choice before retrying a changed document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/email-transfer-consent:
    get:
      operationId: getEmailTransferConsent
      description: Read the effective outbound school email transfer document and the signed-in account's current consent state. A new application still requires its own affirmative action before the first send.
      responses:
        '200':
          description: Effective document reference and account consent state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTransferConsentStatus' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: withdrawEmailTransferConsent
      description: Withdraw the signed-in account's outbound school email transfer consent. Queued deliveries that have not started are stopped. Previously sent codes retain their original validity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The withdrawal was processed. Replays with the same key return the original result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTransferWithdrawal' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/email/confirm:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: confirmEmail
      description: Check the email code. Admitted requests take at least the configured minimum (2.5 seconds by default), including incorrect codes and successful verification. Incorrect codes count toward the account and school/student cooldown in addition to the challenge attempt limit. Admission may return 429 immediately without checking the code or calling the school.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { $ref: '#/components/responses/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/capture:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: createCaptureSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: One-use camera ticket valid for 15 minutes. The QR page keeps the ticket in its fragment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureSession' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/capture:
    post:
      operationId: uploadCapture
      security:
        - captureToken: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Captured material reference. A valid ticket admits a bounded upload of at most 1 MiB and 16 million pixels. A saturated instance returns 429 rate_limited. Each application can retain five images.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/materials:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listMaterials
      responses:
        '200':
          description: Material metadata for this application.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Material' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/materials/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    delete:
      operationId: removeDraftMaterial
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Removed draft material. Approved or pending-review materials cannot be changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Material' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: readMaterial
      responses:
        '200':
          description: Private image, authorized at read time; access is audited.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary, description: Historical imported attachment only. }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/form:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getOwnManualForm
      responses:
        '200':
          description: The applicant's submitted form for resuming a supplement. Access is audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualInput' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/applications/{id}/manual:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: submitManual
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualInput' }
      responses:
        '200': { $ref: '#/components/responses/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/credentials:
    get:
      operationId: listCredentials
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Independent study experiences, including revoked or expired records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Credential' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/summary:
    get:
      operationId: getSummary
      parameters:
        - name: school_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Current student eligibility and independent identity status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/identity:
    post:
      operationId: verifyIdentity
      description: Check campus roster identity independently of student qualification. Admitted requests take at least the configured minimum (2.5 seconds by default), including success and evidence rejection. Consecutive failures share the account and school/student cooldown with application verification. Admission may return 429 immediately without calling the school.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityInput' }
      responses:
        '200':
          description: Independent identity result; this entry does not create a student credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '202': { $ref: '#/components/responses/Processing' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/credentials/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: requestRemoval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemovalInput' }
      responses:
        '200':
          description: Pending request. Eligibility is unchanged until approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovalRequest' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/requests:
    get:
      operationId: listRemovalRequests
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's removal requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemovalRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/suggestions:
    post:
      operationId: suggestSchool
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuggestionInput' }
      responses:
        '200':
          description: A school suggestion for administrators.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suggestion' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/verification/operations/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getOperation
      responses:
        '200':
          description: The caller's durable operation status. Repeat the original request to obtain its exact completed response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/school-data/recheck:
    post:
      operationId: scheduleSchoolDataRecheck
      description: Requires school configuration permission. Makes one person's (by campus credential) or every active school data authorization due now. The worker rechecks two at a time; a rejected password or disabled account ends the authorization and deletes the stored account. Audited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolDataRecheckRequest' }
      responses:
        '200':
          description: Number of authorizations scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolDataRecheckReceipt' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/school-data/recheck/cancel:
    post:
      operationId: cancelSchoolDataRecheck
      description: Requires school configuration permission. Returns authorizations that are due but not yet rechecked to the regular schedule, or off it when automatic rechecks are off. Audited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Number of authorizations taken back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolDataRecheckReceipt' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/schools/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getSchoolConfiguration
      responses:
        '200':
          description: Stored school configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/School' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: configureSchool
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/School' }
      responses:
        '200':
          description: New configuration revision; revision zero creates a school.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/School' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/schools/{id}/applications:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listReviewQueue
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: School-scoped review queue, ordered by creation time ascending (FIFO).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/applications/{id}/form:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: readManualForm
      responses:
        '200':
          description: School-scoped sensitive form access, audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualInput' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/applications/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: reviewApplication
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { $ref: '#/components/responses/Application' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/schools/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listRemovalQueue
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: School-scoped pending requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemovalRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/requests/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: reviewRemoval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: Reviewed request; approved deletion never removes independent identity status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovalRequest' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/credentials/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: revokeCredential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: Revoked credential with preserved history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/credentials/{id}/graduate:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: graduateCredential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: Alumni status preserves eligibility and the original study experience.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/suggestions:
    get:
      operationId: listSuggestions
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pending suggestions, platform administrator only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Suggestion' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/suggestions/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: reviewSuggestion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: Reviewed suggestion. School configuration is a separate explicit action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suggestion' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/access:
    get:
      operationId: checkConsoleAccess
      responses:
        '200':
          description: The current principal has access to the verification console. Each object remains school-scoped.
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed: { type: boolean, enum: [true] }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/overview:
    get:
      operationId: getAdminOverview
      description: Pending review queue and abnormal job counts within the caller's current administrative authorization. When school_id is set, counts are restricted to that school and platform-scoped pending_suggestions is zero.
      parameters:
        - name: school_id
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Authorized pending counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/credentials:
    get:
      operationId: searchAdminCredentials
      description: School-scoped student credential lookup by school_id, student_id (via server-computed identity_hash index), owner, or state. Reads are audited.
      parameters:
        - name: school_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: student_id
          in: query
          schema: { type: string, maxLength: 64 }
        - name: owner
          in: query
          schema: { type: string, maxLength: 2740 }
        - name: state
          in: query
          schema: { type: string, enum: [active, revoked, expired] }
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching student qualifications in the authorized school.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Credential' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getAdminCredential
      responses:
        '200':
          description: Authorized credential metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/jobs:
    get:
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
        - name: school_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Outstanding delivery jobs in the authorized school scope.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/verification/jobs/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: retryJob
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Retry a manual-queue job using its original delivery key. An expired email challenge is never sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '202': { $ref: '#/components/responses/Processing' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    captureToken: { type: apiKey, in: header, name: X-Capture-Token }
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    After:
      name: after
      in: query
      description: Exclusive pagination cursor; accepts either an item ID or a composite RFC3339Nano|ID token.
      schema: { type: string, maxLength: 128 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      description: Retry a rolled-back local write after dependency_unavailable with the same key and body. Operations with external attempts retain their outcome.
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[ -~]+$' }
  responses:
    Application:
      description: Application state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Application' }
    Processing:
      description: An identical operation is still running. Follow Location, then replay the original request.
      headers:
        Location:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Admission capacity, cooldown, or quota exhausted, or an email challenge has no attempts left. A cooldown starts after the fourth consecutive evidence failure. A completed verification clears the counters. Use the retry time before a new attempt. Reuse the original idempotency key for retries of the same operation.
      headers:
        Retry-After:
          required: true
          description: Same positive number of seconds as retry_after_seconds.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RateLimitedProblem' }
    Problem:
      description: Stable error. 400 invalid_input, 401 authentication_required, 403 permission_denied/email_transfer_consent_required, 404 not_found, 409 conflict/identity_owned/email_transfer_consent_changed, 410 expired, 422 information_mismatch/real_name_mismatch/real_name_no_record/email_identity_mismatch/email_identity_no_record/school_credentials_rejected/school_account_locked/school_account_disabled/school_account_unavailable/method_identity_not_allowed, 429 rate_limited, 503 dependency_unavailable/method_unavailable. No provider error or identity data is included.
      headers:
        Retry-After:
          description: Remaining cooldown seconds when rate-limited.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    SchoolDataSubmission:
      type: object
      additionalProperties: false
      required: [student_id, password, accepted]
      properties:
        student_id: { type: string, minLength: 1, maxLength: 64, writeOnly: true }
        password: { type: string, format: password, minLength: 1, maxLength: 256, writeOnly: true }
        accepted: { type: boolean, description: 'Explicit consent to encrypted retention and to rechecks scheduled by the school setting or by an administrator, for personal enrollment reads.' }
    SchoolDataAuthorization:
      type: object
      additionalProperties: false
      required: [state]
      description: Active from a successful check until the person revokes it or a recheck finds the school password rejected, the account disabled or the campus credential ended. An unavailable school service or a locked account keeps it active.
      properties:
        state: { type: string, enum: [inactive, active] }
        verified_at: { type: string, format: date-time, description: Last successful check. }
    SchoolDataRecheckRequest:
      type: object
      additionalProperties: false
      properties:
        credential_id: { type: string, maxLength: 128, description: 'Campus credential whose owner is rechecked; omit to schedule every active authorization.' }
    SchoolDataRecheckReceipt:
      type: object
      additionalProperties: false
      required: [scheduled]
      properties:
        scheduled: { type: integer, minimum: 0, description: 'Authorizations scheduled, or taken back by a cancellation.' }
    TeacherCreateInput:
      type: object
      additionalProperties: false
      required: [school_id, notice_version, consent]
      properties:
        school_id: { type: string, minLength: 1, maxLength: 64 }
        notice_version: { type: string, minLength: 1, maxLength: 64 }
        consent: { type: boolean, enum: [true] }
    TeacherDisclosures:
      type: array
      maxItems: 4
      uniqueItems: true
      items: { type: string, enum: [real_name, teacher, gender, organization] }
    TeacherForm:
      type: object
      additionalProperties: false
      required: [name, organization, email, material_type, material_ids, disclosures, revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        organization: { type: string, minLength: 1, maxLength: 100 }
        gender: { type: string, maxLength: 32 }
        email: { type: string, format: email, maxLength: 254 }
        material_type: { type: string, minLength: 1, maxLength: 64 }
        material_ids:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, maxLength: 64 }
        disclosures: { $ref: '#/components/schemas/TeacherDisclosures' }
        revision: { type: integer, format: int64, minimum: 1 }
    TeacherReviewInput:
      type: object
      additionalProperties: false
      required: [decision, note, revision, teacher_ids]
      properties:
        decision: { type: string, enum: [approve, reject, supplement] }
        note: { type: string, minLength: 1, maxLength: 500 }
        revision: { type: integer, format: int64, minimum: 1 }
        teacher_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Nonempty on approval, otherwise empty. All canonical teacher profiles must belong to the application school.
          items: { type: string, minLength: 1, maxLength: 128 }
        expires_at: { type: string, format: date-time, nullable: true, description: Null means valid until revoked. }
    TeacherCredential:
      type: object
      required: [id, school_id, teacher_ids, state, revision, verified_at, expires_at, source, disclosures, note]
      properties:
        id: { type: string }
        school_id: { type: string }
        teacher_ids:
          type: array
          items: { type: string }
        state: { type: string, enum: [active, revoked, expired] }
        revision: { type: integer, format: int64 }
        verified_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        source: { type: string, description: Manual approval evidence reference; no raw material. }
        note: { type: string, description: Approval or revocation explanation. }
        disclosures: { $ref: '#/components/schemas/TeacherDisclosures' }
    TeacherDisclosureInput:
      type: object
      additionalProperties: false
      required: [revision, disclosures]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        disclosures: { $ref: '#/components/schemas/TeacherDisclosures' }
    Method:
      type: string
      enum: [real_name_identity_check, school_sso, student_email_outbound_otp, student_email_inbound_challenge, manual_material_review]
    Stage:
      type: string
      enum: [bachelor, master, doctor, other, unknown]
    Kind:
      type: string
      enum: [student, alumni, newcomer, unknown]
    MethodCapabilities:
      type: object
      additionalProperties: false
      required: [study_stage_required]
      properties:
        study_stage_required: { type: boolean, description: When false the applicant stage is ignored and source facts determine the recorded stage. Defaults to true when absent. }
        allowed_kinds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Kind' }
    MethodDescriptionKeys:
      type: object
      maxProperties: 5
      additionalProperties: { type: string, maxLength: 128, pattern: '^verification\.methodDescriptions\.[a-z_]+$' }
      description: User-visible explanation keys by method. Real-name checks use verification.methodDescriptions.real_name_identity_check for both school and authorized third-party providers.
    School:
      type: object
      additionalProperties: false
      required: [id, name, enabled, methods, notice_version, opening_date, newcomer_days, email_domain, material_types, revision]
      properties:
        method_description_keys: { $ref: '#/components/schemas/MethodDescriptionKeys' }
        method_capabilities:
          type: object
          readOnly: true
          additionalProperties: { $ref: '#/components/schemas/MethodCapabilities' }
        profile_schema: { type: string, readOnly: true, description: Data schema advertised by the school adapter; independent from the selected authentication method. }
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        methods:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/Method' }
        notice_version: { type: string, minLength: 1, maxLength: 64 }
        opening_date: { type: string, description: 'YYYY-MM-DD in Asia/Shanghai, or empty when newcomer applications are disabled.' }
        newcomer_days: { type: integer, minimum: 1, maximum: 366, default: 90 }
        school_data_recheck_days: { type: integer, minimum: 0, maximum: 365, default: 0, description: 'Automatic recheck period of school data authorizations in days; 0 or omitted turns automatic rechecks off.' }
        email_domain: { type: string, maxLength: 253 }
        material_types:
          type: array
          minItems: 0
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Allowed material types for student manual verification; may be empty when manual_material_review is not enabled.
        teacher_enabled:
          type: boolean
          description: Independent switch for manual teacher verification. Disabled by default.
        teacher_material_types:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Allowed materials for teachers. Enabling teacher verification requires at least one teacher material type.
        revision: { type: integer, format: int64, minimum: 0 }
    CreateApplication:
      type: object
      additionalProperties: false
      required: [school_id, method, kind, notice_version, consent]
      properties:
        school_id: { type: string, maxLength: 64 }
        method: { $ref: '#/components/schemas/Method' }
        stage: { $ref: '#/components/schemas/Stage' }
        kind: { $ref: '#/components/schemas/Kind' }
        notice_version: { type: string, maxLength: 64 }
        consent: { type: boolean, enum: [true] }
    Application:
      type: object
      required: [id, school_id, method, stage, kind, state, revision, created_at, updated_at, expires_at, credential_id, result_code]
      properties:
        id: { type: string }
        school_id: { type: string }
        method: { $ref: '#/components/schemas/Method' }
        stage: { $ref: '#/components/schemas/Stage' }
        kind: { type: string, enum: [student, alumni, newcomer, unknown, teacher] }
        state: { type: string, enum: [in_progress, pending_review, supplement_required, approved, rejected, expired, cancelled, deleted] }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        credential_id: { type: string }
        result_code: { type: string }
        review_note: { type: string }
        material_type: { type: string, maxLength: 64, description: 'Non-sensitive material category selected in manual submission.' }
        material_count: { type: integer, minimum: 0, maximum: 5, description: 'Number of captured images submitted with the manual form.' }
        school_challenge: { $ref: '#/components/schemas/SchoolChallenge' }
        qualification_expires_at: { type: string, format: date-time, nullable: true }
    VerifyInput:
      type: object
      additionalProperties: false
      required: [student_id, name, document_number, password]
      properties:
        student_id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, maxLength: 100 }
        document_number: { type: string, maxLength: 32, description: Required only for real-name matching; never persisted. }
        password: { type: string, maxLength: 256, format: password, description: Required only for school SSO; never persisted. }
      oneOf:
        - properties:
            name: { type: string, minLength: 2 }
            document_number: { type: string, minLength: 3 }
            password: { type: string, maxLength: 0 }
        - properties:
            name: { type: string, maxLength: 0 }
            document_number: { type: string, maxLength: 0 }
            password: { type: string, minLength: 1 }
    IdentityInput:
      type: object
      additionalProperties: false
      required: [student_id, name, document_number, password, school_id, notice_version, consent]
      properties:
        student_id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 2, maxLength: 100 }
        document_number: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, maxLength: 0 }
        school_id: { type: string, maxLength: 64 }
        notice_version: { type: string, maxLength: 64 }
        consent: { type: boolean, enum: [true] }
    EmailInput:
      type: object
      additionalProperties: false
      required: [student_id, name]
      properties:
        student_id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        email_transfer_consent:
          $ref: '#/components/schemas/EmailTransferConsentInput'
        locale:
          type: string
          enum: [zh-CN, en-US, fr-FR, ru-RU, ja-JP, ko-KR, es-ES, ar-EG]
          description: 'Preferred message locale; defaults to zh-CN when omitted.'
    EmailTransferConsentInput:
      description: Affirmative choice for the document shown before requesting outbound school email delivery. Omit for inbound challenges and when resending under the same application's current, active receipt.
      type: object
      additionalProperties: false
      required: [document_id, version, digest, accepted]
      properties:
        document_id: { type: string, enum: [email-transfer] }
        version: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
        digest: { type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of the published HTML bytes. }
        accepted: { type: boolean, enum: [true] }
    EmailTransferDocument:
      type: object
      required: [document_id, version, digest, url]
      properties:
        document_id: { type: string, enum: [email-transfer] }
        version: { type: string }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        url: { type: string, format: uri, description: Read this immutable publication before accepting. }
    EmailTransferConsentStatus:
      type: object
      required: [document, accepted]
      properties:
        document: { $ref: '#/components/schemas/EmailTransferDocument' }
        accepted: { type: boolean }
        accepted_at: { type: string, format: date-time }
    EmailTransferWithdrawal:
      type: object
      required: [withdrawn]
      properties:
        withdrawn: { type: boolean, enum: [true] }
    EmailChallenge:
      type: object
      required: [id, application_id, expires_at, state, masked_email, target_address]
      properties:
        id: { type: string }
        application_id: { type: string }
        expires_at: { type: string, format: date-time }
        resend_available_at: { type: string, format: date-time, description: Earliest UTC timestamp when resending is permitted. }
        remaining_attempts: { type: integer, minimum: 0, maximum: 5, description: Remaining OTP confirmation attempts for outbound challenges. }
        state: { type: string, enum: [queued, waiting, delivered, used, failed] }
        masked_email: { type: string }
        target_address: { type: string, description: Only inbound challenges expose a random one-use destination. }
    CaptureSession:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    Material:
      type: object
      required: [id, application_id, content_type, size, created_at]
      properties:
        id: { type: string }
        application_id: { type: string }
        content_type: { type: string, enum: [image/jpeg, image/png, application/pdf], description: 'PDF is retained only for imported historical materials.' }
        size: { type: integer }
        created_at: { type: string, format: date-time }
    ManualInput:
      type: object
      additionalProperties: false
      required: [student_id, name, department, email, material_type, material_ids, revision]
      properties:
        student_id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 100 }
        department: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        material_type: { type: string, maxLength: 64 }
        material_ids:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
    ReviewInput:
      type: object
      additionalProperties: false
      required: [decision, note, revision]
      properties:
        decision: { type: string, enum: [approve, reject, supplement] }
        note: { type: string, minLength: 1, maxLength: 500 }
        revision: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time, nullable: true, description: 'Optional reviewer override, only for newcomers.' }
    Credential:
      type: object
      required: [id, school_id, method, stage, kind, state, student_display, revision, verified_at, expires_at]
      properties:
        id: { type: string }
        school_id: { type: string }
        method: { $ref: '#/components/schemas/Method' }
        stage: { $ref: '#/components/schemas/Stage' }
        kind: { $ref: '#/components/schemas/Kind' }
        state: { type: string, enum: [active, revoked, expired, deleted] }
        student_display: { type: string }
        revision: { type: integer, format: int64 }
        verified_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
    DocumentType:
      type: string
      enum: [cn_resident_id_card]
      description: Document type confirmed by the real-name verification source.
    IdentityMasked:
      type: object
      additionalProperties: false
      required: [name, document_type, document_number]
      description: Server-generated mask from successful real-name verification. Star counts follow original Unicode code-point lengths. Never contains full identity values.
      properties:
        name: { type: string, minLength: 2, maxLength: 100, description: All characters except the last are replaced with stars. }
        document_type: { $ref: '#/components/schemas/DocumentType' }
        document_number: { type: string, minLength: 3, maxLength: 32, description: All characters except the first and last are replaced with stars. }
    Summary:
      type: object
      required: [campus_eligibility, teacher_verified, identity_verified, evaluated_at, revision, next_evaluation_at]
      properties:
        campus_eligibility: { type: boolean }
        teacher_verified: { type: boolean, description: Current manually reviewed teacher qualification in the requested school; independent of student eligibility. }
        identity_verified: { type: boolean }
        identity_masked:
          allOf: [{ $ref: '#/components/schemas/IdentityMasked' }]
          description: Present for every successful own summary with identity_verified=true. Absent when not verified and from trusted eligibility-fact reads. Missing stored proof is a service error, never an apparently verified summary without masks.
        evaluated_at: { type: string, format: date-time }
        revision: { type: integer, format: int64 }
        next_evaluation_at: { type: string, format: date-time, nullable: true }
        next_evaluation_school_id: { type: string, description: 'School ID of the earliest expiring active qualification, guiding temporary newcomers to formal verification.' }
    RemovalInput:
      type: object
      additionalProperties: false
      required: [kind, reason]
      properties:
        kind: { type: string, enum: [revoke, delete] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RemovalRequest:
      type: object
      required: [id, credential_id, school_id, kind, state, reason, note, revision, created_at]
      properties:
        target_type: { type: string, enum: [student, teacher], description: Qualification category; defaults to student when omitted. }
        id: { type: string }
        credential_id: { type: string }
        school_id: { type: string }
        kind: { type: string, enum: [revoke, delete] }
        state: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        note: { type: string }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    DecisionInput:
      type: object
      additionalProperties: false
      required: [approve, note, revision]
      properties:
        approve: { type: boolean }
        note: { type: string, minLength: 1, maxLength: 500 }
        revision: { type: integer, format: int64, minimum: 1 }
    SuggestionInput:
      type: object
      additionalProperties: false
      required: [name, website]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        website: { type: string, format: uri, maxLength: 500, pattern: '^[Hh][Tt][Tt][Pp][Ss]://[^/@?#]+([/?#]|$)', description: HTTPS school website with a host and no user information. }
    Suggestion:
      type: object
      required: [id, name, website, state, note, revision]
      properties:
        id: { type: string }
        name: { type: string }
        website: { type: string }
        state: { type: string, enum: [pending, approved, rejected] }
        note: { type: string }
        revision: { type: integer, format: int64 }
    Operation:
      type: object
      required: [id, state, code, expires_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [processing, completed, failed] }
        code: { type: string }
        expires_at: { type: string, format: date-time }
    AdminOverview:
      type: object
      additionalProperties: false
      required: [pending_student_applications, pending_teacher_applications, pending_removal_requests, pending_suggestions, abnormal_jobs]
      properties:
        pending_student_applications: { type: integer, minimum: 0 }
        pending_teacher_applications: { type: integer, minimum: 0 }
        pending_removal_requests: { type: integer, minimum: 0 }
        pending_suggestions: { type: integer, minimum: 0 }
        abnormal_jobs: { type: integer, minimum: 0 }
    Job:
      type: object
      required: [id, school_id, kind, state, attempts, code]
      properties:
        id: { type: string }
        school_id: { type: string }
        kind: { type: string, enum: [mail] }
        state: { type: string, enum: [pending, running, manual, done] }
        attempts: { type: integer }
        code: { type: string }
    Problem:
      type: object
      required: [code]
      properties:
        code: { type: string }
        operation_id: { type: string }
        retry_after_seconds: { type: integer, minimum: 1 }
        remaining_attempts: { type: integer, minimum: 0 }
    RateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [retry_after_seconds]
    SchoolChallenge:
      type: object
      additionalProperties: false
      required: [id, state, code, masked_phone, expires_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [processing, waiting_sms, authenticated, failed, cancelled, expired] }
        code: { type: string }
        masked_phone: { type: string }
        expires_at: { type: string, format: date-time }
    SchoolChallengeInput:
      type: object
      additionalProperties: false
      required: [action, challenge_id, revision]
      properties:
        action: { type: string, enum: [poll, submit_sms, cancel] }
        challenge_id: { type: string, minLength: 1, maxLength: 128 }
        revision: { type: integer, format: int64, minimum: 1 }
        code: { type: string, maxLength: 8, description: School SMS code; used once and never persisted. }
    StudentProfile:
      type: object
      additionalProperties: false
      required: [school_id, data_status, schema, revision, collected_at, fields, field_sources, source_revision]
      properties:
        school_id: { type: string }
        data_status: { type: string, enum: [complete, partial, reference_only, unavailable] }
        schema: { type: string }
        revision: { type: integer, format: int64, minimum: 0 }
        collected_at: { type: string, format: date-time, nullable: true }
        source_revision: { type: string }
        fields:
          type: object
          maxProperties: 64
          additionalProperties: true
          description: School-specific business fields; absent and explicit null remain distinct. Exact decimal quantities use decimal strings and known timestamps use RFC 3339. Sensitive fields are masked or omitted according to current authorization.
        field_sources:
          type: object
          additionalProperties: { type: string }
        raw_data: { type: string, maxLength: 1048576, description: Classified business JSON only; omitted without explicit raw-data authorization. }
